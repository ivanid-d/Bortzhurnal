<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Бортжурнал</title>
<meta name="theme-color" content="#EEF2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1424" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Бортжурнал">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F7; --surface:#FFFFFF; --ink:#14213D; --muted:#5B6B82; --line:#D3DCE8;
  --accent:#F2A900; --accent-ink:#14213D; --soft:#E2E9F2;
  --m1:#7D8BA1; --m2:#9DB4D6; --m3:#C9D3E1; --m4:#F5CF6B; --m5:#F2A900;
  --danger:#C2412D;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1424; --surface:#15203A; --ink:#E8EEF7; --muted:#93A3BC; --line:#26344F;
    --accent:#F5B82E; --accent-ink:#0C1424; --soft:#1C2945;
    --m1:#5E6B80; --m2:#4D6A94; --m3:#34445F; --m4:#C99D35; --m5:#F5B82E;
    --danger:#E8735F; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1424; --surface:#15203A; --ink:#E8EEF7; --muted:#93A3BC; --line:#26344F;
  --accent:#F5B82E; --accent-ink:#0C1424; --soft:#1C2945;
  --m1:#5E6B80; --m2:#4D6A94; --m3:#34445F; --m4:#C99D35; --m5:#F5B82E;
  --danger:#E8735F; color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Onest,"Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:560px;margin:0 auto;padding:16px 18px calc(92px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.brand{font:500 14px/1 Unbounded,Onest,sans-serif;letter-spacing:.02em;color:var(--muted)}
.status{font-size:13px;color:var(--muted);min-height:18px;text-align:right}
.banner{background:var(--soft);border-left:3px solid var(--accent);padding:10px 12px;border-radius:0 8px 8px 0;font-size:14px;margin:8px 0 4px}
h1{font:700 clamp(32px,9vw,44px)/1.05 Unbounded,Onest,sans-serif;margin:0;letter-spacing:-.01em}
h2{font:600 18px/1.3 Onest,sans-serif;margin:28px 0 10px}
.sub{color:var(--muted);margin:4px 0 0}
.daynav{display:flex;align-items:center;gap:8px;margin-top:10px}
.dayhead{flex:1;min-width:0}
.nav{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1;display:grid;place-items:center;flex:none}
.nav:disabled{opacity:.35;cursor:default}
.link{background:none;border:0;padding:6px 0;color:var(--ink);text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px;font-size:14px}
.log{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.log li{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;padding-top:1px}
.mom img{display:block;width:100%;max-height:420px;object-fit:cover;border-radius:10px;margin-bottom:8px;background:var(--soft)}
.mom p{margin:0 0 6px;white-space:pre-wrap;word-wrap:break-word}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.del{margin-left:auto;background:none;border:0;color:var(--muted);font-size:13px;padding:4px 0}
.del.armed{color:var(--danger);font-weight:600}
.edit{background:none;border:0;color:var(--muted);font-size:13px;padding:4px 0;margin-left:auto}
.edit+.del{margin-left:14px}
.editor{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.editor img{display:block;width:100%;max-height:300px;object-fit:cover;border-radius:8px;margin-bottom:6px}
.editor textarea{min-height:60px;margin-top:10px}
.timerow{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:14px;color:var(--muted)}
.timerow input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;color:var(--ink);font-size:16px}
.photoacts{display:flex;gap:16px;flex-wrap:wrap}
.photoacts label{color:var(--ink);text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px;font-size:14px;padding:6px 0;cursor:pointer;position:relative}
.photoacts input{position:absolute;opacity:0;width:1px;height:1px}
.empty{color:var(--muted);margin:0;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.btn{border:0;border-radius:10px;padding:12px 16px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:500}
.btn.wide{width:100%;margin-top:12px}
.composer{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.composer img{display:block;width:100%;max-height:300px;object-fit:cover;border-radius:8px;margin-bottom:8px}
.filebtn{display:inline-flex;align-items:center;gap:8px;border:1px dashed var(--line);border-radius:10px;padding:12px 14px;width:100%;justify-content:center;color:var(--muted);cursor:pointer}
.filebtn input{position:absolute;opacity:0;width:1px;height:1px}
textarea,input[type=text]{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;resize:vertical;line-height:1.45}
textarea{min-height:72px}
.composer textarea{min-height:60px;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 11px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.actions{display:flex;gap:8px;margin-top:12px}
.actions .btn{flex:1}
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mood{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 2px 8px;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:6px}
.mood span{width:18px;height:18px;border-radius:50%}
.mood[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:600}
label.f{display:block;margin-top:14px;font-size:14px;color:var(--muted)}
label.f textarea,label.f input{margin-top:6px;color:var(--ink);font-size:16px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{background:none;border:0;padding:14px 4px 12px;font-size:15px;color:var(--muted);border-top:3px solid transparent;margin-top:-1px}
.tabs button[aria-current="page"]{color:var(--ink);font-weight:600;border-top-color:var(--accent)}
.feedday{padding:16px 0;border-bottom:1px solid var(--line)}
.feedday:first-child{border-top:1px solid var(--line)}
.feedhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;background:none;border:0;padding:0;width:100%;text-align:left}
.feedhead strong{font:500 17px/1.3 Unbounded,Onest,sans-serif}
.strip{display:flex;gap:6px;overflow-x:auto;margin:10px 0 4px}
.strip img{width:96px;height:96px;object-fit:cover;border-radius:8px;flex:none;background:var(--soft)}
.feedday ul{margin:8px 0 0;padding:0;list-style:none}
.feedday li{display:flex;gap:8px;align-items:baseline;margin:3px 0}
.feedday li .dot{transform:translateY(-1px)}
.q{margin:8px 0 0;padding-left:12px;border-left:2px solid var(--line);color:var(--ink)}
.q b{font-weight:600;color:var(--muted);font-size:13px;display:block}
.shift{margin:8px 0 0;font-weight:500}
.shift::before{content:"★ ";color:var(--accent)}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.monthnav h1{font-size:clamp(26px,7.5vw,36px);text-align:center;flex:1}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:16px}
.wd{text-align:center;font-size:12px;color:var(--muted);padding-bottom:2px}
.cell{aspect-ratio:1;border-radius:6px;border:0;padding:0;position:relative;background:var(--soft) center/cover no-repeat;overflow:hidden}
.cell span{position:absolute;left:5px;top:3px;font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted)}
.cell.photo span{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.cell.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cell:disabled{cursor:default;opacity:.45}
.note{color:var(--muted);font-size:14px;margin:12px 0 0}
.seg{display:inline-grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:12px}
.seg button{border:0;background:transparent;padding:8px 18px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:84px 1fr 28px;align-items:center;gap:10px;font-size:14px}
.bar i{display:block;height:10px;border-radius:5px;min-width:2px}
.bar em{font-style:normal;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.moodrow{display:flex;gap:4px;flex-wrap:wrap}
.moodrow div{width:30px;text-align:center;font-size:11px;color:var(--muted)}
.moodrow div i{display:block;height:30px;border-radius:6px;margin-bottom:3px;background:var(--soft)}
.shifts{list-style:none;margin:0;padding:0}
.shifts li{padding:8px 0;border-bottom:1px solid var(--line)}
.shifts li small{display:block;color:var(--muted);font-size:13px}
.recap{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px;line-height:1.55}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
@media (prefers-reduced-motion: no-preference){
  .composer{animation:rise .18s ease-out}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}
.banner .btn{margin-top:8px;padding:8px 12px;font-size:14px}
.filebtn.small{width:auto;margin-top:12px;border-style:solid;color:var(--ink);justify-content:center;width:100%}
</style></head>
<body>
<div class="wrap">
  <div class="top"><span class="brand">Бортжурнал</span><span class="status" id="status" role="status"></span></div>
  <div id="banner"></div>
  <main id="view"></main>
</div>
<nav class="tabs" aria-label="Разделы"><div>
  <button data-tab="today">День</button>
  <button data-tab="feed">Лента</button>
  <button data-tab="month">Месяц</button>
  <button data-tab="review">Итоги</button>
</div></nav>

<script>
const SPHERES=[
  {k:'study',n:'Учёба',c:'#4C7BD9'},
  {k:'projects',n:'Проекты',c:'#8A5CE6'},
  {k:'sport',n:'Спорт',c:'#1E9E6A'},
  {k:'music',n:'Музыка',c:'#D9548C'},
  {k:'people',n:'Близкие',c:'#E0861E'},
  {k:'money',n:'Деньги',c:'#6A9A2E'},
  {k:'self',n:'Мысли',c:'#7D8BA1'}
];
const MOODS=[{v:1,n:'Пусто'},{v:2,n:'Тяжело'},{v:3,n:'Ровно'},{v:4,n:'Хорошо'},{v:5,n:'Огонь'}];
const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const WD=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const sph=k=>SPHERES.find(s=>s.k===k)||SPHERES[6];

let DB=null, days={};
const timers={}, urls={};
const today=()=>ds(new Date());
let cur=today(), view='today', monthRef=today().slice(0,7);
let reviewMode='week', reviewRef=today();
let composer={open:false,blob:null,preview:null,text:'',sphere:'study',busy:false};
let armed=null, copyFallback='';
let editing=null; // {id,text,sphere,t,blob,preview,removePhoto,busy}

function ds(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parse(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return ds(d)}
function fmtDay(s){return parse(s).toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}
function fmtWd(s){return parse(s).toLocaleDateString('ru-RU',{weekday:'long'})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function blank(date){return {date,moments:[],mood:0,feel:'',action:'',shift:''}}
function dayOf(date){if(!days[date])days[date]=blank(date);return days[date]}
function has(d){return !!d&&(d.moments?.length||d.mood||d.feel?.trim()||d.action?.trim()||d.shift?.trim())}
function setStatus(t){document.getElementById('status').textContent=t}
function moodColor(v){return v?`var(--m${v})`:'var(--soft)'}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}

/* ---------- хранилище на телефоне (IndexedDB) ---------- */
function openDB(){return new Promise((res,rej)=>{
  const r=indexedDB.open('bortzhurnal',1);
  r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('days'))d.createObjectStore('days',{keyPath:'date'});if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos',{keyPath:'id'})};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
})}
function tx(store,mode,fn){return new Promise((res,rej)=>{
  const t=DB.transaction(store,mode);const req=fn(t.objectStore(store));
  t.oncomplete=()=>res(req?req.result:undefined);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);
})}
function persist(date,delay=0){
  clearTimeout(timers[date]);
  timers[date]=setTimeout(async()=>{
    if(!DB)return;
    const d=days[date];
    try{
      if(has(d))await tx('days','readwrite',s=>s.put(JSON.parse(JSON.stringify(d))));
      else{await tx('days','readwrite',s=>s.delete(date));delete days[date]}
      setStatus('Сохранено');
    }catch(e){setStatus(e&&e.name==='QuotaExceededError'?'Память телефона заполнена':'Не сохранилось')}
  },delay);
}
async function photoURL(id){
  if(urls[id])return urls[id];
  const rec=await tx('photos','readonly',s=>s.get(id));
  if(!rec)return null;
  urls[id]=URL.createObjectURL(new Blob([rec.buf],{type:rec.type||'image/jpeg'}));
  return urls[id];
}
function hydrate(){
  document.querySelectorAll('[data-photo]').forEach(async el=>{
    const id=el.dataset.photo;el.removeAttribute('data-photo');
    const u=await photoURL(id).catch(()=>null);if(!u)return;
    if(el.tagName==='IMG')el.src=u;else{el.style.backgroundImage=`url('${u}')`;el.classList.add('photo')}
  });
}

async function init(){
  readHash();
  try{DB=await openDB();const all=await tx('days','readonly',s=>s.getAll());(all||[]).forEach(d=>days[d.date]=d)}
  catch(e){setStatus('Хранилище недоступно');}
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  render();
}
function standalone(){return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}
function daysSinceBackup(){const b=ls('lastBackup');if(!b)return null;return Math.round((parse(today())-parse(b))/864e5)}
function rBanner(){
  const el=document.getElementById('banner');
  if(!DB){el.innerHTML='<div class="banner">Браузер не даёт сохранять данные. Открой журнал в Safari, не в режиме «Частный доступ».</div>';return}
  if(!standalone()){el.innerHTML='<div class="banner">Добавь журнал на экран «Домой» (Поделиться → На экран «Домой») и открывай оттуда. У приложения на экране своё хранилище, и Safari его не чистит.</div>';return}
  const any=Object.values(days).some(has), n=daysSinceBackup();
  if(view==='today'&&any&&(n===null||n>=7)){
    el.innerHTML=`<div class="banner">${n===null?'Резервной копии ещё не было.':`Последняя копия была ${n} дн. назад.`} Если телефон потеряется, записи после неё пропадут.<br><button class="btn" data-act="backup">Сделать копию</button></div>`;return}
  el.innerHTML='';
}

/* ---------- навигация ---------- */
function readHash(){const h=location.hash.replace('#','');if(['today','feed','month','review'].includes(h))view=h}
window.addEventListener('hashchange',()=>{readHash();render()});
document.querySelector('.tabs').addEventListener('click',e=>{
  const b=e.target.closest('[data-tab]');if(!b)return;
  view=b.dataset.tab;history.replaceState(null,'','#'+view);render();window.scrollTo(0,0);
});
function go(date){cur=date;view='today';history.replaceState(null,'','#today');render();window.scrollTo(0,0)}

/* ---------- экраны ---------- */
function render(){
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===view?'page':'false'));
  document.getElementById('view').innerHTML=view==='today'?rToday():view==='feed'?rFeed():view==='month'?rMonth():rReview();
  rBanner();hydrate();
}
function rToday(){
  const d=days[cur]||blank(cur), isT=cur===today();
  const moms=(d.moments||[]).map(m=>editing&&editing.id===m.id?rEditor(m):`
    <li><span class="time">${esc(m.t||'')}</span><div class="mom">
      ${m.photo?`<img data-photo="${m.photo}" alt="">`:''}
      ${m.text?`<p>${esc(m.text)}</p>`:''}
      <div class="row"><span class="tag"><i class="dot" style="background:${sph(m.sphere).c}"></i>${sph(m.sphere).n}</span>
      <button class="edit" data-act="edit" data-id="${m.id}">Изменить</button>
      <button class="del ${armed===m.id?'armed':''}" data-act="del" data-id="${m.id}">${armed===m.id?'Точно удалить?':'Удалить'}</button></div>
    </div></li>`).join('');
  return `
  <div class="daynav">
    <button class="nav" data-act="prev" aria-label="Предыдущий день">‹</button>
    <div class="dayhead"><h1>${fmtDay(cur)}</h1><p class="sub">${fmtWd(cur)}${isT?', сегодня':''}</p></div>
    <button class="nav" data-act="next" aria-label="Следующий день" ${cur>=today()?'disabled':''}>›</button>
  </div>
  ${isT?'':'<button class="link" data-act="gotoday">Вернуться к сегодняшнему дню</button>'}
  <h2>Моменты</h2>
  ${moms?`<ol class="log">${moms}</ol>`:`<p class="empty">Сфотографируй что-нибудь или запиши строчку, чтобы день не потерялся.</p>`}
  ${rComposer()}
  <h2>Итог дня</h2>
  <div class="moods" role="group" aria-label="Самочувствие">${MOODS.map(m=>`<button class="mood" data-act="mood" data-v="${m.v}" aria-pressed="${d.mood===m.v}"><span style="background:var(--m${m.v})"></span>${m.n}</button>`).join('')}</div>
  <label class="f">Как я себя ощущаю<textarea data-f="feel" rows="3">${esc(d.feel)}</textarea></label>
  <label class="f">Что я с этим делаю<textarea data-f="action" rows="3">${esc(d.action)}</textarea></label>

function closeEditor(){if(editing&&editing.preview)URL.revokeObjectURL(editing.preview);editing=null}
async function saveEdit(){
  const e=editing, d=dayOf(cur), m=d.moments.find(x=>x.id===e.id);
  if(!m){closeEditor();render();return}
  const keepsPhoto=e.blob||(m.photo&&!e.removePhoto);
  if(!e.text.trim()&&!keepsPhoto){setStatus('Оставь фото или строчку, или удали момент');return}
  e.busy=true;render();
  const old=m.photo;let photo=old;
  if(e.blob){
    try{photo='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      const buf=await e.blob.arrayBuffer();
      await tx('photos','readwrite',s=>s.put({id:photo,type:'image/jpeg',buf}))}
    catch(err){e.busy=false;render();setStatus('Фото не сохранилось: возможно, мало памяти');return}
  }else if(e.removePhoto)photo=null;
  m.text=e.text.trim();m.sphere=e.sphere;m.t=e.t;m.photo=photo;
  if(old&&old!==photo){tx('photos','readwrite',s=>s.delete(old)).catch(()=>{});if(urls[old]){URL.revokeObjectURL(urls[old]);delete urls[old]}}
  closeEditor();persist(cur);render();setStatus('Момент изменён');
}
function resetComposer(){if(composer.preview)URL.revokeObjectURL(composer.preview);composer={open:false,blob:null,preview:null,text:'',sphere:composer.sphere,busy:false}}

async function shrink(file){
  const url=URL.createObjectURL(file);
  try{
    const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const k=Math.min(1,1600/Math.max(im.naturalWidth,im.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    return await new Promise((res,rej)=>c.toBlob(bl=>bl?res(bl):rej(new Error('blob')),'image/jpeg',0.84));
  }finally{URL.revokeObjectURL(url)}
}
async function saveMoment(){
  const text=composer.text.trim();
  if(!text&&!composer.blob){setStatus('Добавь фото или строчку');return}
  if(!DB){setStatus('Хранилище недоступно');return}
  composer.busy=true;render();
  let photo=null;
  if(composer.blob){
    try{photo='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      const buf=await composer.blob.arrayBuffer();
      await tx('photos','readwrite',s=>s.put({id:photo,type:'image/jpeg',buf}));}
    catch(e){composer.busy=false;render();setStatus('Фото не сохранилось: возможно, мало памяти');return}
  }
  const now=new Date();
  dayOf(cur).moments.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    t:cur===today()?String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'):'',
    text,sphere:composer.sphere,photo});
  resetComposer();persist(cur);render();
}

async function saveFile(blob,name){
  const file=new File([blob],name,{type:blob.type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file]});return true}
    catch(e){if(e&&e.name==='AbortError')return false}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},5000);
  return true;
}
function toB64(buf){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(new Blob([buf]))})}

async function backup(btn){
  const list=Object.values(days).filter(has);
  if(!list.length){setStatus('Пока нечего сохранять');return}
  const label=btn.textContent;btn.disabled=true;btn.textContent='Готовлю копию…';
  try{
    const ids=new Set();list.forEach(d=>(d.moments||[]).forEach(m=>m.photo&&ids.add(m.photo)));
    const parts=[`{"app":"bortzhurnal","version":1,"exportedAt":${JSON.stringify(new Date().toISOString())},"days":`,JSON.stringify(list),',"photos":{'];
    let first=true;
    for(const id of ids){
      const rec=await tx('photos','readonly',s=>s.get(id));if(!rec)continue;
      parts.push((first?'':',')+JSON.stringify(id)+':'+JSON.stringify({type:rec.type,data:await toB64(rec.buf)}));first=false;
    }
    parts.push('}}');
    const ok=await saveFile(new Blob(parts,{type:'application/json'}),`bortzhurnal-${today()}.json`);
    if(ok){ls('lastBackup',today());setStatus('Копия готова');render()}
  }catch(e){setStatus('Копия не сохранилась')}
  finally{btn.disabled=false;btn.textContent=label}
}
async function restore(file){
  setStatus('Восстанавливаю…');
  try{
    const data=JSON.parse(await file.text());
    if(data.app!=='bortzhurnal'||!Array.isArray(data.days))throw new Error('format');
    for(const [id,p] of Object.entries(data.photos||{})){
      const bin=atob(p.data);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
      await tx('photos','readwrite',s=>s.put({id,type:p.type||'image/jpeg',buf:u.buffer}));
    }
    for(const d of data.days){if(d&&d.date){await tx('days','readwrite',s=>s.put(d));days[d.date]=d}}
    setStatus(`Восстановлено дней: ${data.days.length}`);render();
  }catch(e){setStatus(e&&e.message==='format'?'Это не копия Бортжурнала':'Не получилось восстановить')}
}

async function collage(btn){
  const [y,m]=monthRef.split('-').map(Number);
  const ids=[];
  for(let i=1;i<=31;i++){const d=days[`${monthRef}-${String(i).padStart(2,'0')}`];const p=d?.moments?.find(x=>x.photo);if(p)ids.push({id:p.photo,day:i})}
  if(!ids.length){setStatus('В этом месяце пока нет фото');return}
  btn.disabled=true;btn.textContent='Собираю коллаж…';
  try{
    let pick=ids;if(ids.length>16){pick=[];for(let i=0;i<16;i++)pick.push(ids[Math.round(i*(ids.length-1)/15)])}
    const W=1080,H=1350,pad=40,top=190;
    const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
    g.fillStyle='#14213D';g.fillRect(0,0,W,H);
    try{await document.fonts.load('700 72px Unbounded')}catch(e){}
    g.fillStyle='#F2A900';g.font='700 72px Unbounded, sans-serif';g.fillText(MONTHS[m-1],pad,110);
    g.fillStyle='#C9D3E1';g.font='500 30px Onest, sans-serif';g.fillText(`${y}, дней с фото: ${ids.length}`,pad,155);
    const n=pick.length, cols=n<=1?1:n<=4?2:n<=9?3:4, rows=Math.ceil(n/cols), gap=10;
    const cw=(W-pad*2-gap*(cols-1))/cols, ch=Math.min(cw*1.15,(H-top-pad-gap*(rows-1))/rows);
    const imgs=await Promise.all(pick.map(async p=>{const u=await photoURL(p.id);if(!u)return null;return new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src=u})}));
    pick.forEach((p,i)=>{
      const x=pad+(i%cols)*(cw+gap), yy=top+Math.floor(i/cols)*(ch+gap), im=imgs[i];
      g.save();g.beginPath();g.roundRect?g.roundRect(x,yy,cw,ch,14):g.rect(x,yy,cw,ch);g.clip();
      g.fillStyle='#1C2945';g.fillRect(x,yy,cw,ch);
      if(im){const s=Math.max(cw/im.naturalWidth,ch/im.naturalHeight),iw=im.naturalWidth*s,ih=im.naturalHeight*s;g.drawImage(im,x+(cw-iw)/2,yy+(ch-ih)/2,iw,ih)}
      g.restore();
      g.font='600 26px Onest, sans-serif';g.fillStyle='#fff';g.shadowColor='rgba(0,0,0,.6)';g.shadowBlur=6;g.fillText(String(p.day),x+14,yy+ch-16);g.shadowBlur=0;
    });
    const blob=await new Promise(r=>c.toBlob(r,'image/png'));
    if(await saveFile(blob,`kollazh-${monthRef}.png`))setStatus('Коллаж готов');
  }catch(e){setStatus('Коллаж не сохранился')}
  finally{btn.disabled=false;btn.textContent='Сохранить коллаж месяца'}
}
async function copyText(btn){
  const [a,b]=rangeOf();const txt=exportText(a,b);
  if(!txt){setStatus('За этот период записей нет');return}
  try{await navigator.clipboard.writeText(txt);btn.textContent='Скопировано';setTimeout(()=>{btn.textContent='Скопировать записи'},1800)}
  catch(e){copyFallback=txt;render();setStatus('Выдели текст ниже и скопируй')}
}

init();
</script>
